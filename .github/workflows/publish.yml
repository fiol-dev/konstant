name: Publish
on:
  release:
    types: [ released, prereleased ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY_CONTENTS }}
      ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Publish to MavenCentral
        # The Gradle plugin is an included build, so its publish task is named explicitly
        run: ./gradlew publishToMavenCentral :konstant-gradle-plugin:publishToMavenCentral --no-configuration-cache
