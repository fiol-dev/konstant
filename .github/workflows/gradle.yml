# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:
  # Lets CI be started by hand, e.g. when a run failed to start and can't be retried
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: macos-latest
          - target: macosArm64Test
            os: macos-latest
          - target: jvmTest :konstant-ksp:test :konstant-ksp-tests:test :konstant-gradle-plugin:test
            os: ubuntu-latest
          - target: jsNodeTest
            os: ubuntu-latest
          - target: jsBrowserTest wasmJsNodeTest wasmJsBrowserTest
            os: ubuntu-latest
          - target: linuxX64Test
            os: ubuntu-latest
          - target: testAndroidHostTest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build with Gradle
      run: ./gradlew ${{ matrix.target }} --continue

  # Fails when the public API no longer matches the dumps in each module's api/ folder.
  # After an intended API change, run ./gradlew updateLegacyAbi and commit the new dumps.
  api:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Check public API
      run: ./gradlew checkLegacyAbi

  # Builds the merged API docs (./gradlew dokkaGenerate) so broken KDoc links fail the PR.
  # The generated site is attached to the run as the "api-docs" artifact.
  docs:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Generate API docs
      run: ./gradlew dokkaGenerate
    - uses: actions/upload-artifact@v4
      with:
        name: api-docs
        path: build/dokka/html
